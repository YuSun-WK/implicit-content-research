<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>K-DIR 输入盲审</title>
<style>body{font:16px/1.6 system-ui;max-width:1100px;margin:24px auto;padding:20px;color:#17252b}header{position:sticky;top:0;background:#fff;padding:12px;border-bottom:2px solid #456}article{border:1px solid #bbb;border-radius:12px;padding:20px;margin:24px 0}.images{display:flex;gap:12px;flex-wrap:wrap}figure{margin:0;flex:1;min-width:260px}img{width:100%;max-height:430px;object-fit:contain;background:#eee}textarea,input,select{font:inherit;box-sizing:border-box;max-width:100%;padding:7px}textarea{width:100%;min-height:65px}label{display:block;margin:12px 0}button{padding:10px;margin:6px}small{color:#555}.warn{background:#fff4cd;padding:12px}details{margin:12px 0}</style>
<header><h1>K-DIR 第一阶段：输入与资料盲审</h1><label>审核者匿名编号 <input id="reviewer" placeholder="例如 R01；第二审核者另存独立文件"></label><button id="save">保存草稿到浏览器</button><button id="export">导出审核JSON</button><button onclick="window.print()">打印/PDF</button><span id="notice"></span></header>
<p class="warn">此包含4份现有编辑资料，尚无合格K-DIR四格组。不要把来源当安全金标，也不要为凑组虚构Iu/Is或反向指令。无法建立目标风险、明确指令或完整配对时，请填UNKNOWN或排除原因。此页面不含模型预测或解释。</p>
<details open><summary>固定政策 CP-v1</summary><p id="policy"></p></details><p>先查看实图与原始指令；分别填操作er/en的r/a/s、两源状态事实、四格理想后果与政策条款。合法幂等需明确说明。未知授权/背景不得硬判。独立第二审核者应在未见首评文件时填写自己的副本；分歧另留记录。</p><main id="cards"></main>
<script id="dataset" type="application/json">__DATA_JSON__</script>
<script>
const packageData=JSON.parse(document.getElementById('dataset').textContent), fields=[
['source_linkage_evidence','源图—原始指令—目标图关联证据'],['risk_critical_facts','目标风险关键事实（未建立请说明）'],['Iu_evidence','哪张可作Iu及证据'],['Is_evidence','哪张可作Is及证据'],
['er_referent','er: referent'],['er_action','er: action'],['er_specification','er: specification'],['er_instruction_evidence','er原始指令证据（不能仅交换图像虚构）'],['er_on_Is','er在Is可执行/幂等的依据'],
['en_referent','en: referent'],['en_action','en: action'],['en_specification','en: specification'],['en_retains_risk','en保留目标风险且无关的依据'],['other_violations','移除目标风险后是否仍有其它违规'],['ambiguity','歧义/授权/缺失背景'],['policy_clauses','适用政策条款及事实依据'],['disagreement','分歧记录；第二评审完成前可留空'],['exclusion_reason','无法组成四格时的排除原因']];
document.getElementById('policy').textContent=packageData.policy;
const root=document.getElementById('cards');
for(const d of packageData.dossiers){const card=document.createElement('article');card.dataset.id=d.group_id;let title=document.createElement('h2');title.textContent=d.group_id+' — '+d.source;card.append(title);let instr=document.createElement('p');instr.textContent='原始指令（SOURCE_LABEL，不是风险金标）：'+d.instruction;card.append(instr);let imgs=document.createElement('div');imgs.className='images';for(const im of d.images){let f=document.createElement('figure'),img=document.createElement('img'),caption=document.createElement('figcaption');img.src=im.path;img.alt=im.role;caption.textContent=im.role+' | sha256 '+im.sha256;f.append(img,caption);imgs.append(f)}card.append(imgs);if(!d.images.some(x=>x.role==='target_img')){let m=document.createElement('p');m.textContent='目标图当前未取得，不能完成关联核验。';card.append(m)}for(const [key,label] of fields){let l=document.createElement('label'),t=document.createElement('textarea');l.textContent=label;t.dataset.key=key;l.append(t);card.append(l)}for(const c of ['Iu_er','Iu_en','Is_er','Is_en']){let l=document.createElement('label'),t=document.createElement('textarea'),select=document.createElement('select');l.textContent=c+' 理想后果及最终标签';t.dataset.key=c+'_outcome';select.dataset.key=c+'_label';for(const value of ['UNKNOWN','ALLOW','BLOCK']){let o=document.createElement('option');o.value=value;o.textContent=value;select.append(o)}l.append(t,select);card.append(l)}let l=document.createElement('label'),s=document.createElement('select');l.textContent='本次资料审核状态（不等于自动准入）';s.dataset.key='review_status';for(const v of ['PENDING','REVIEWED','EXCLUDE','UNRESOLVED']){let o=document.createElement('option');o.value=v;o.textContent=v;s.append(o)}l.append(s);card.append(l);root.append(card)}
function collect(){return {schema_version:'KDIR-review-v1',stage:1,reviewer_anonymous_id:document.getElementById('reviewer').value.trim(),time_utc:new Date().toISOString(),policy_sha256:packageData.policy_sha256,package_id:packageData.package_id,evidence_level:'HUMAN_RESPONSE_REQUIRES_VALIDATION',groups:[...document.querySelectorAll('article')].map(card=>({group_id:card.dataset.id,...Object.fromEntries([...card.querySelectorAll('[data-key]')].map(e=>[e.dataset.key,e.value]))}))}}
try{let old=JSON.parse(localStorage.getItem(packageData.package_id)||'null');if(old){document.getElementById('reviewer').value=old.reviewer_anonymous_id||'';for(const g of old.groups||[]){let card=[...document.querySelectorAll('article')].find(c=>c.dataset.id===g.group_id);if(card)for(const e of card.querySelectorAll('[data-key]'))if(g[e.dataset.key]!==undefined)e.value=g[e.dataset.key]}}}catch(e){}
document.getElementById('save').onclick=()=>{try{localStorage.setItem(packageData.package_id,JSON.stringify(collect()));document.getElementById('notice').textContent='草稿已保存；请仍导出JSON。'}catch(e){alert('浏览器不允许本地存储，请导出JSON。')}};
document.getElementById('export').onclick=()=>{const data=collect();if(!data.reviewer_anonymous_id){alert('请填审核者匿名编号');return}const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=packageData.package_id+'-'+data.reviewer_anonymous_id+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};
</script></html>
