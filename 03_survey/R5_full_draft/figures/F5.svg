<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="705" viewBox="0 0 1440 705" role="img" aria-label="图5｜多模态安全评价：区分风险判断与回应行为">
<style>text{font-family:"Noto Sans CJK SC","Microsoft YaHei","Source Han Sans SC",sans-serif;fill:#16324b} .title{font-size:35px;font-weight:700}.subtitle{font-size:21px;fill:#456177} .bandText{font-size:24px;font-weight:700;fill:#204b6d} .cardTitle{font-size:25px;font-weight:700}.body{font-size:21px}.small{font-size:19px;fill:#456177}.note{font-size:21px;fill:#456177}</style>
<rect width="1440" height="705" fill="#fff"/>
<text class="title" x="45" y="56">图5｜多模态安全评价：区分风险判断与回应行为</text><text class="subtitle" x="45" y="96">风险分类正确，不等于模型会安全回应；拒答也不能证明模型识别了风险。</text><line x1="45" y1="118" x2="1395" y2="118" stroke="#aac0cf" stroke-width="1.5"/>
<rect x="45" y="139" width="1350" height="49" rx="9" fill="#e8f1f7" stroke="#aac0cf" stroke-width="1.6"/>
<text class="bandText" x="65" y="173">同一输入：图像、文字与情境；评价应明确所采用的安全政策</text>
<path d="M720 189 V211 H382 V232 M720 211 H1070 V232" fill="none" stroke="#204b6d" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="45" y="235" width="656" height="172" rx="9" fill="#f3f7f9" stroke="#aac0cf" stroke-width="1.6"/>
<text class="cardTitle" x="65" y="272">A｜输入风险判断（分类任务）</text>
<text class="body" x="65" y="311">G：外部标注或政策定义的风险标签</text>
<text class="body" x="65" y="342">P：模型显式预测的风险类别</text>
<text class="body" x="65" y="373">评价：漏检、误报与各风险等级表现</text>
<rect x="738" y="235" width="656" height="172" rx="9" fill="#f3f7f9" stroke="#aac0cf" stroke-width="1.6"/>
<text class="cardTitle" x="758" y="272">B｜安全回应（生成任务）</text>
<text class="body" x="758" y="311">R：拒答、警示、帮助等实际行为</text>
<text class="body" x="758" y="342">Q：回应的安全性与帮助性</text>
<text class="body" x="758" y="373">评价：不安全帮助和正常请求误拒</text>
<rect x="45" y="429" width="1350" height="49" rx="9" fill="#e8f1f7" stroke="#aac0cf" stroke-width="1.6"/>
<text class="bandText" x="65" y="463">危险侧与正常侧的错误需要分开报告</text>
<rect x="45" y="494" width="656" height="134" rx="9" fill="#f3f7f9" stroke="#aac0cf" stroke-width="1.6"/>
<text class="cardTitle" x="65" y="531">危险请求</text>
<text class="body" x="65" y="570">分类侧：漏判风险</text>
<text class="body" x="65" y="601">回应侧：提供不安全帮助</text>
<rect x="738" y="494" width="656" height="134" rx="9" fill="#f3f7f9" stroke="#aac0cf" stroke-width="1.6"/>
<text class="cardTitle" x="758" y="531">正常请求</text>
<text class="body" x="758" y="570">分类侧：误报风险</text>
<text class="body" x="758" y="601">回应侧：不必要地拒绝合法请求</text>
<line x1="45" y1="644" x2="1395" y2="644" stroke="#aac0cf" stroke-width="1.4"/>
<text class="note" x="45" y="676">若模型未显式输出风险类别，不能仅凭拒答行为倒推内部风险判断。</text>
</svg>