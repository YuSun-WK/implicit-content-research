<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="569" viewBox="0 0 1440 569" role="img" aria-label="图3｜编码语言研究中的四类不同问题">
<style>text{font-family:"Noto Sans CJK SC","Microsoft YaHei","Source Han Sans SC",sans-serif;fill:#16324b} .title{font-size:35px;font-weight:700}.subtitle{font-size:21px;fill:#456177} .bandText{font-size:24px;font-weight:700;fill:#204b6d} .cardTitle{font-size:25px;font-weight:700}.body{font-size:21px}.small{font-size:19px;fill:#456177}.note{font-size:21px;fill:#456177}</style>
<rect width="1440" height="569" fill="#fff"/>
<text class="title" x="45" y="56">图3｜编码语言研究中的四类不同问题</text><text class="subtitle" x="45" y="96">同一表达可能涉及多项研究任务，但预测目标和正确答案并不相同。</text><line x1="45" y1="118" x2="1395" y2="118" stroke="#aac0cf" stroke-width="1.5"/>
<rect x="45" y="140" width="1350" height="49" rx="9" fill="#e8f1f7" stroke="#aac0cf" stroke-width="1.6"/>
<text class="bandText" x="65" y="174">四类问题相互关联，但不构成必须依次执行的处理流程</text>
<rect x="45" y="209" width="331" height="165" rx="9" fill="#f3f7f9" stroke="#aac0cf" stroke-width="1.6"/>
<text class="cardTitle" x="65" y="246">发现编码词项</text>
<text class="body" x="65" y="285">语料中有哪些可能具有</text>
<text class="body" x="65" y="316">特殊含义的表达？</text>
<text class="body" x="65" y="347">评价：词项检索与发现</text>
<rect x="393" y="209" width="331" height="165" rx="9" fill="#f3f7f9" stroke="#aac0cf" stroke-width="1.6"/>
<text class="cardTitle" x="413" y="246">判断实例义项</text>
<text class="body" x="413" y="285">已知编码词在这一语境中</text>
<text class="body" x="413" y="316">使用普通义还是编码义？</text>
<text class="body" x="413" y="347">评价：上下文义项标签</text>
<rect x="741" y="209" width="331" height="165" rx="9" fill="#f3f7f9" stroke="#aac0cf" stroke-width="1.6"/>
<text class="cardTitle" x="761" y="246">恢复具体含义</text>
<text class="body" x="761" y="285">该表达在当前语境中</text>
<text class="body" x="761" y="316">指向什么含义或对象？</text>
<text class="body" x="761" y="347">评价：意义或解释依据</text>
<rect x="1089" y="209" width="331" height="165" rx="9" fill="#f3f7f9" stroke="#aac0cf" stroke-width="1.6"/>
<text class="cardTitle" x="1109" y="246">判断是否有害</text>
<text class="body" x="1109" y="285">结合目标、立场与政策，</text>
<text class="body" x="1109" y="316">内容是否构成危害？</text>
<text class="body" x="1109" y="347">评价：规范性风险标签</text>
<rect x="45" y="390" width="1349" height="94" rx="9" fill="#f3f7f9" stroke="#aac0cf" stroke-width="1.6"/>
<text class="cardTitle" x="65" y="427">共同影响因素</text>
<text class="body" x="65" y="466">会话与社群约定 · 词典和候选含义 · 时间变化 · 测试时可获得的信息</text>
<line x1="45" y1="506" x2="1395" y2="506" stroke="#aac0cf" stroke-width="1.4"/>
<text class="note" x="45" y="538">发现编码表达，不意味着已经理解其具体含义，更不能仅凭形式判断有害。</text>
</svg>