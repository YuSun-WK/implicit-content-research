<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="850" viewBox="0 0 1440 850" role="img" aria-label="图1｜广义隐晦信息的研究框架">
<style>text{font-family:"Noto Sans CJK SC","Microsoft YaHei","Source Han Sans SC",sans-serif;fill:#16324b} .title{font-size:35px;font-weight:700}.subtitle{font-size:21px;fill:#456177} .bandText{font-size:24px;font-weight:700;fill:#204b6d} .cardTitle{font-size:25px;font-weight:700}.body{font-size:21px}.small{font-size:19px;fill:#456177}.note{font-size:21px;fill:#456177}</style>
<rect width="1440" height="850" fill="#fff"/>
<text class="title" x="45" y="56">图1｜广义隐晦信息的研究框架</text><text class="subtitle" x="45" y="96">从意义形成机制、研究任务和评价依据三个维度组织相关研究。</text><line x1="45" y1="118" x2="1395" y2="118" stroke="#aac0cf" stroke-width="1.5"/>
<rect x="45" y="139" width="1350" height="49" rx="9" fill="#e8f1f7" stroke="#aac0cf" stroke-width="1.6"/>
<text class="bandText" x="65" y="173">一、隐含意义通过哪些机制形成？</text>
<rect x="45" y="204" width="425" height="130" rx="9" fill="#f3f7f9" stroke="#aac0cf" stroke-width="1.6"/>
<text class="cardTitle" x="65" y="241">语用推断</text>
<text class="body" x="65" y="280">根据语境理解会话含意</text>
<text class="body" x="65" y="311">与间接言语行为</text>
<rect x="507" y="204" width="425" height="130" rx="9" fill="#f3f7f9" stroke="#aac0cf" stroke-width="1.6"/>
<text class="cardTitle" x="527" y="241">修辞表达</text>
<text class="body" x="527" y="280">通过隐喻、反讽等形式</text>
<text class="body" x="527" y="311">传递非字面意义</text>
<rect x="969" y="204" width="425" height="130" rx="9" fill="#f3f7f9" stroke="#aac0cf" stroke-width="1.6"/>
<text class="cardTitle" x="989" y="241">社群编码</text>
<text class="body" x="989" y="280">依靠群体共享的约定</text>
<text class="body" x="989" y="311">理解暗语与狗哨</text>
<rect x="45" y="348" width="1349" height="61" rx="9" fill="#f3f7f9" stroke="#aac0cf" stroke-width="1.6"/>
<text class="cardTitle" x="65" y="385">跨模态组合：图像、文字等不同来源的信息共同影响解释；可与上述三类机制交叉。</text>
<rect x="45" y="425" width="1350" height="49" rx="9" fill="#e8f1f7" stroke="#aac0cf" stroke-width="1.6"/>
<text class="bandText" x="65" y="459">二、模型需要回答哪些研究问题？</text>
<rect x="45" y="491" width="650" height="177" rx="9" fill="#f3f7f9" stroke="#aac0cf" stroke-width="1.6"/>
<text class="cardTitle" x="65" y="528">意义理解（T1–T3）</text>
<text class="body" x="65" y="567">T1  表达识别：识别现象是否存在</text>
<text class="body" x="65" y="598">T2  意义解释：恢复隐含含义</text>
<text class="body" x="65" y="629">T3  交际功能：推断语境中的作用</text>
<rect x="738" y="491" width="656" height="177" rx="9" fill="#f3f7f9" stroke="#aac0cf" stroke-width="1.6"/>
<text class="cardTitle" x="758" y="528">危害判断与安全回应（T4–T6）</text>
<text class="body" x="758" y="567">T4  有害性判断：结合目标、立场与政策</text>
<text class="body" x="758" y="598">T5  联合模态风险：T4的特定联合条件</text>
<text class="body" x="758" y="629">T6  安全回应：评价生成行为与帮助性</text>
<rect x="45" y="688" width="1350" height="49" rx="9" fill="#e8f1f7" stroke="#aac0cf" stroke-width="1.6"/>
<text class="bandText" x="65" y="722">三、评价结果时需要核对什么？</text>
<rect x="45" y="752" width="422" height="96" rx="9" fill="#f3f7f9" stroke="#aac0cf" stroke-width="1.6"/>
<text class="cardTitle" x="65" y="789">X  输入信息</text>
<text class="body" x="65" y="828">原始输入与辅助条件</text>
<rect x="510" y="752" width="422" height="96" rx="9" fill="#f3f7f9" stroke="#aac0cf" stroke-width="1.6"/>
<text class="cardTitle" x="530" y="789">G  标注依据</text>
<text class="body" x="530" y="828">正确答案及分歧来源</text>
<rect x="975" y="752" width="419" height="96" rx="9" fill="#f3f7f9" stroke="#aac0cf" stroke-width="1.6"/>
<text class="cardTitle" x="995" y="789">E  评价方式</text>
<text class="body" x="995" y="828">指标、分母与评审标准</text>
</svg>