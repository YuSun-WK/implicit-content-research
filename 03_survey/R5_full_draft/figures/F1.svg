<svg xmlns="http://www.w3.org/2000/svg" width="1560" height="860" viewBox="0 0 1560 860" role="img" aria-label="F1">
<style>
  text { font-family: "Microsoft YaHei", "Noto Sans CJK SC", "Source Han Sans SC", sans-serif; fill: #17212b; }
  .title { font-size: 30px; font-weight: 700; }
  .section { font-size: 20px; font-weight: 700; }
  .label { font-size: 18px; font-weight: 600; }
  .small { font-size: 15px; }
  .box { fill: #f7f9fb; stroke: #24384a; stroke-width: 2; }
  .alt { fill: #fff; stroke: #24384a; stroke-width: 2; stroke-dasharray: 7 5; }
  .band { fill: #edf3f7; stroke: #24384a; stroke-width: 1.5; }
  .link { fill: none; stroke: #24384a; stroke-width: 2; }
  .dash { fill: none; stroke: #516473; stroke-width: 2; stroke-dasharray: 7 6; }
</style>
<rect width="1560" height="860" fill="#fff"/>
<text x="50" y="53" class="title">F1  广义隐晦信息研究地图</text><rect x="50" y="80" width="1460" height="48" rx="6" class="band"/><text x="66" y="110" class="section">A  表达与意义机制（现象可交叉，均不预设有害）</text><rect x="50" y="146" width="350" height="88" rx="8" class="box"/><text x="68" y="178" class="label">K1 语用含意 / 间接行动</text><text x="68" y="206" class="small">研究意义、对象与关系</text><rect x="420" y="146" width="350" height="88" rx="8" class="box"/><text x="438" y="178" class="label">K2 修辞 / 隐喻 / 反讽</text><text x="438" y="206" class="small">研究意义、对象与关系</text><rect x="790" y="146" width="350" height="88" rx="8" class="box"/><text x="808" y="178" class="label">K3 社群编码 / 狗哨</text><text x="808" y="206" class="small">研究意义、对象与关系</text><rect x="1160" y="146" width="350" height="88" rx="8" class="box"/><text x="1178" y="178" class="label">K4 跨模态组合意义</text><text x="1178" y="206" class="small">研究意义、对象与关系</text><rect x="50" y="260" width="1460" height="48" rx="6" class="band"/><text x="66" y="290" class="section">B  规范评价与安全行为（不是意义机制）</text><rect x="170" y="325" width="570" height="86" rx="8" class="box"/><text x="188" y="357" class="label">R1 语境化隐晦有害性</text><text x="188" y="385" class="small">目标、立场、规范与人审分歧</text><rect x="820" y="325" width="570" height="86" rx="8" class="box"/><text x="838" y="357" class="label">R2 联合输入风险与安全回应</text><text x="838" y="385" class="small">输入风险与输出行为分别评价</text><rect x="50" y="440" width="1460" height="48" rx="6" class="band"/><text x="66" y="470" class="section">C  任务轴：工作性 T1–T6，多对多对应研究现象</text><rect x="50" y="505" width="460" height="78" rx="8" class="box"/><text x="68" y="537" class="label">T1 表达识别</text><text x="68" y="565" class="small">不同标签与评价对象</text><rect x="550" y="505" width="460" height="78" rx="8" class="box"/><text x="568" y="537" class="label">T2 意义解释</text><text x="568" y="565" class="small">不同标签与评价对象</text><rect x="1050" y="505" width="460" height="78" rx="8" class="box"/><text x="1068" y="537" class="label">T3 语用功能</text><text x="1068" y="565" class="small">不同标签与评价对象</text><rect x="50" y="600" width="460" height="78" rx="8" class="alt"/><text x="68" y="632" class="label">T4 有害判断</text><text x="68" y="660" class="small">不同标签与评价对象</text><rect x="550" y="600" width="460" height="78" rx="8" class="alt"/><text x="568" y="632" class="label">T5 联合模态风险</text><text x="568" y="660" class="small">T4 的特定联合条件</text><rect x="1050" y="600" width="460" height="78" rx="8" class="alt"/><text x="1068" y="632" class="label">T6 安全回应</text><text x="1068" y="660" class="small">输出安全与帮助性</text><rect x="50" y="715" width="1460" height="48" rx="6" class="band"/><text x="66" y="745" class="section">D  每项实验须登记证据条件</text><rect x="50" y="780" width="460" height="58" rx="8" class="box"/><text x="68" y="812" class="label">X 输入与信息预算</text><rect x="550" y="780" width="460" height="58" rx="8" class="box"/><text x="568" y="812" class="label">G 标注与风险政策</text><rect x="1050" y="780" width="460" height="58" rx="8" class="box"/><text x="1068" y="812" class="label">E 指标、分母与干预</text>
</svg>
