<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="709" viewBox="0 0 1440 709" role="img" aria-label="图4｜跨模态研究：输入信息与验证方式">
<style>text{font-family:"Noto Sans CJK SC","Microsoft YaHei","Source Han Sans SC",sans-serif;fill:#16324b} .title{font-size:35px;font-weight:700}.subtitle{font-size:21px;fill:#456177} .bandText{font-size:24px;font-weight:700;fill:#204b6d} .cardTitle{font-size:25px;font-weight:700}.body{font-size:21px}.small{font-size:19px;fill:#456177}.note{font-size:21px;fill:#456177}</style>
<rect width="1440" height="709" fill="#fff"/>
<text class="title" x="45" y="56">图4｜跨模态研究：输入信息与验证方式</text><text class="subtitle" x="45" y="96">性能提升可能来自模态互补，也可能来自额外提供的信息。</text><line x1="45" y1="118" x2="1395" y2="118" stroke="#aac0cf" stroke-width="1.5"/>
<rect x="45" y="139" width="1350" height="49" rx="9" fill="#e8f1f7" stroke="#aac0cf" stroke-width="1.6"/>
<text class="bandText" x="65" y="173">第一步｜明确原始输入与额外信息</text>
<rect x="45" y="203" width="659" height="131" rx="9" fill="#f3f7f9" stroke="#aac0cf" stroke-width="1.6"/>
<text class="cardTitle" x="65" y="240">原始任务输入</text>
<text class="body" x="65" y="279">例如：图像与原配文、视频与原音频</text>
<text class="body" x="65" y="310">区分：仅文本、仅图像及联合输入</text>
<rect x="737" y="203" width="657" height="131" rx="9" fill="#f3f7f9" stroke="#aac0cf" stroke-width="1.6"/>
<text class="cardTitle" x="757" y="240">额外信息及其来源</text>
<text class="body" x="757" y="279">例如：人工情绪标签、源/目标概念、外部检索</text>
<text class="body" x="757" y="310">区分：训练时提供、推理时提供、仅供评分</text>
<rect x="45" y="355" width="1350" height="49" rx="9" fill="#e8f1f7" stroke="#aac0cf" stroke-width="1.6"/>
<text class="bandText" x="65" y="389">第二步｜通过针对性对照回答不同问题</text>
<rect x="45" y="421" width="424" height="159" rx="9" fill="#f3f7f9" stroke="#aac0cf" stroke-width="1.6"/>
<text class="cardTitle" x="65" y="458">模态贡献</text>
<text class="body" x="65" y="497">分别测文本、图像与联合输入</text>
<text class="body" x="65" y="528">检验联合条件下的性能增益</text>
<text class="body" x="65" y="559">注意缺失模态的分布变化</text>
<rect x="508" y="421" width="423" height="159" rx="9" fill="#f3f7f9" stroke="#aac0cf" stroke-width="1.6"/>
<text class="cardTitle" x="528" y="458">信息优势</text>
<text class="body" x="528" y="497">比较有无辅助信息的结果</text>
<text class="body" x="528" y="528">保持模型、样本与预算尽量一致</text>
<text class="body" x="528" y="559">检查特权信息是否进入测试</text>
<rect x="970" y="421" width="424" height="159" rx="9" fill="#f3f7f9" stroke="#aac0cf" stroke-width="1.6"/>
<text class="cardTitle" x="990" y="458">反事实依赖</text>
<text class="body" x="990" y="497">替换关键图像或文本因素</text>
<text class="body" x="990" y="528">独立确认替换后的正确标签</text>
<text class="body" x="990" y="559">观察预测是否随相关因素变化</text>
<rect x="45" y="595" width="1349" height="97" rx="9" fill="#f3f7f9" stroke="#aac0cf" stroke-width="1.6"/>
<text class="cardTitle" x="65" y="632">结论边界</text>
<text class="body" x="65" y="671">模态消融只能表明相应设置下的性能差异；正确依赖仍需有效干预与独立真值。</text>
</svg>